name: Build Android + iOS and Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish immediately instead of creating a draft release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.x
  EAS_CLI_VERSION: 23.0.0
  BUILD_TYPE: preview
  EAS_PROFILE: preview

jobs:
  quality:
    name: Verify source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate release metadata
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases must be created from the main branch"
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$PACKAGE_VERSION" != "$APP_VERSION" ]; then
            echo "package.json ($PACKAGE_VERSION) and app.json ($APP_VERSION) versions differ"
            exit 1
          fi

          if git rev-parse "refs/tags/v${PACKAGE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${PACKAGE_VERSION} already exists. Bump package.json and app.json before releasing."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run all checks
        run: npm run check

  build-android:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    env:
      EAS_LOCAL_BUILD_SKIP_CLEANUP: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Android artifact
        id: android-artifact
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          APK_NAME="zhihu-minus-minus-v${APP_VERSION}-${BUILD_TYPE}-arm64-v8a.apk"
          APK_PATH="${RUNNER_TEMP}/${APK_NAME}"
          echo "path=${APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Prepare Firebase config
        env:
          FIREBASE_ANDROID_JSON_B64: ${{ secrets.FIREBASE_ANDROID_JSON_B64 }}
        if: ${{ env.FIREBASE_ANDROID_JSON_B64 != '' }}
        run: |
          mkdir -p assets/config/google-services
          printf '%s' "$FIREBASE_ANDROID_JSON_B64" | base64 --decode > assets/config/google-services/google-services.real.json

      - name: Build APK
        run: eas build --platform android --profile "$EAS_PROFILE" --local --non-interactive --output="${{ steps.android-artifact.outputs.path }}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ steps.android-artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  build-ios:
    name: Build unsigned iOS IPA
    needs: quality
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild iOS
        run: npx expo prebuild --platform ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build unsigned iOS app
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          SENTRY_NO_UPLOAD: "1"
        run: |
          cd ios
          echo "export NODE_BINARY=$(which node)" > .xcode.env.local
          echo "export SENTRY_DISABLE_AUTO_UPLOAD=true" >> .xcode.env.local
          echo "export SENTRY_NO_UPLOAD=1" >> .xcode.env.local

          WORKSPACE_PATH=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          WORKSPACE=$(basename "$WORKSPACE_PATH")
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Found workspace: $WORKSPACE, scheme: $SCHEME"

          set +e
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build > xcodebuild.log 2>&1

          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "xcodebuild failed with exit code $EXIT_CODE"
            grep -i -E "error:|failed:|fatal:" xcodebuild.log | head -n 50
            tail -n 100 xcodebuild.log
            exit "$EXIT_CODE"
          fi

      - name: Package unsigned IPA
        id: ios-artifact
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          IPA_NAME="zhihu-minus-minus-v${APP_VERSION}-unsigned.ipa"
          ARTIFACT_DIR="${RUNNER_TEMP}/ipa-build"
          APP_PATH=$(find build -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "No compiled .app was found"
            exit 1
          fi

          mkdir -p "${ARTIFACT_DIR}/Payload"
          cp -R "$APP_PATH" "${ARTIFACT_DIR}/Payload/"
          cd "$ARTIFACT_DIR"
          zip -r "$IPA_NAME" Payload
          echo "path=${ARTIFACT_DIR}/${IPA_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: ${{ steps.ios-artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs:
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Android and iOS artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release assets
        id: release
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v${APP_VERSION}"
          mapfile -t FILES < <(find dist -maxdepth 1 -type f \( -name "*.apk" -o -name "*.ipa" \) | sort)

          if [ "${#FILES[@]}" -ne 2 ]; then
            echo "Expected one APK and one IPA, found ${#FILES[@]} release assets"
            exit 1
          fi

          (
            cd dist
            sha256sum ./*.apk ./*.ipa > SHA256SUMS.txt
          )

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists. Bump package.json and app.json before creating another release."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Bump package.json and app.json before creating another release."
            exit 1
          fi

          mapfile -t FILES < <(find dist -maxdepth 1 -type f \( -name "*.apk" -o -name "*.ipa" -o -name "SHA256SUMS.txt" \) | sort)
          RELEASE_FLAGS=(
            --title "$RELEASE_TAG"
            --target "$GITHUB_SHA"
            --generate-notes
            --fail-on-no-commits
            --notes "Android 为 arm64-v8a preview APK；iOS 为未签名 IPA。SHA256SUMS.txt 可用于校验下载文件。"
          )

          if [ "$PUBLISH_RELEASE" != "true" ]; then
            RELEASE_FLAGS+=(--draft)
          fi

          gh release create "$RELEASE_TAG" "${FILES[@]}" "${RELEASE_FLAGS[@]}"
